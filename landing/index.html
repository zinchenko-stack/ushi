<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ushi — запись звука и экрана на Mac</title>
  <meta name="description" content="Приложение, которое записывает звук и экран для важного, и превращает это в текст с удобным поиском.">
  <meta property="og:title" content="Ushi — записывай важное">
  <meta property="og:description" content="Записывает звук и экран, превращает в текст с удобным поиском.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/icon-512.png">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#222e3d">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161616">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5f4;
      --container-primary: #ffffff;
      --element-primary: #101010;
      --element-secondary: #54585c;
      --element-tertiary: #abafb2;
      --element-accent: #222e3d;
      --logo-from: #222e3d;
      --logo-to: #171c24;
      --element-inverse: #ffffff;
    }

    /* Тёмная тема — по системной настройке посетителя. */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --container-primary: #232323;
        --element-primary: #f2f2f2;
        --element-secondary: #a3a7ab;
        --element-tertiary: #63676b;
        --element-accent: #e3e8ef;
        --logo-from: #33455c;
        --logo-to: #243142;
      }

      /* Тёмно-синий квадрат логотипа не сливается с тёмной плашкой. */
      .pill .logo-square {
        outline: 1px solid rgba(255, 255, 255, 0.1);
        outline-offset: -1px;
      }

      .cta {
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "Onest", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--element-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 40px 24px;
    }

    main {
      display: flex;
      flex: 1 0 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 944px;
      gap: 40px;
    }

    .pill {
      background: var(--container-primary);
      border-radius: 20px;
      padding: 6px 16px 6px 6px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .pill .logo-square {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pill .logo-square svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    .pill .brand {
      font-family: "Unbounded", sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 1;
      color: var(--element-accent);
    }

    h1 {
      font-family: "Unbounded", sans-serif;
      font-weight: 400;
      font-size: 52px;
      line-height: 68px;
      letter-spacing: 0;
      text-align: center;
      max-width: 800px;
    }

    h1 .muted {
      color: var(--element-tertiary);
      display: block;
    }

    h1 .accent {
      color: var(--element-primary);
      display: block;
    }

    .lead {
      font-family: "Onest", sans-serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 32px;
      letter-spacing: -0.36px;
      color: var(--element-primary);
      text-align: center;
      max-width: 520px;
    }

    .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-top: 8px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(to bottom, var(--logo-from), var(--logo-to));
      color: var(--element-inverse);
      text-decoration: none;
      min-height: 48px;
      padding: 12px 40px;
      border-radius: 16px;
      font-family: "Onest", sans-serif;
      font-weight: 500;
      font-size: 17px;
      line-height: 24px;
      letter-spacing: -0.34px;
      transition: filter 0.15s ease, transform 0.15s ease;
    }

    .cta:hover {
      filter: brightness(1.25);
    }

    .cta:active {
      transform: scale(0.98);
    }

    .cta .apple-icon {
      width: 16px;
      height: 20px;
      display: block;
      flex-shrink: 0;
    }

    .caption {
      font-family: "Onest", sans-serif;
      font-weight: 400;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.14px;
      color: var(--element-secondary);
      text-align: center;
    }

    /* Hero entrance animation — fade + lift, staggered */
    @keyframes hero-rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pill, h1, .lead, .action {
      opacity: 0;
      animation: hero-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .pill   { animation-delay: 0.05s; }
    h1      { animation-delay: 0.20s; }
    .lead   { animation-delay: 0.35s; }
    .action { animation-delay: 0.50s; }

    @media (prefers-reduced-motion: reduce) {
      .pill, h1, .lead, .action {
        animation: none;
        opacity: 1;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 28px 16px;
      }
      main {
        gap: 28px;
      }
      .pill {
        border-radius: 16px;
        padding-right: 12px;
      }
      h1 {
        font-size: 32px;
        line-height: 40px;
      }
      .pill .brand {
        font-size: 16px;
      }
      .pill .logo-square {
        border-radius: 12px;
      }
      .lead {
        font-size: 17px;
        line-height: 26px;
        letter-spacing: -0.34px;
      }
      .action {
        gap: 18px;
      }
      .cta {
        gap: 10px;
        padding: 12px 24px;
        font-size: 16px;
        line-height: 22px;
        letter-spacing: -0.32px;
      }
      .caption {
        font-size: 13px;
        line-height: 18px;
        letter-spacing: -0.13px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="pill">
      <span class="logo-square">
        <svg viewBox="0 0 928 928" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="ushiLogoBg" x1="464" y1="0" x2="464" y2="928" gradientUnits="userSpaceOnUse">
              <stop stop-color="#222E3D"/>
              <stop offset="1" stop-color="#171C24"/>
            </linearGradient>
          </defs>
          <rect width="928" height="928" fill="url(#ushiLogoBg)"/>
          <path d="M524.439 780.729C549.552 780.729 570.735 773.729 588.244 759.885C606.562 745.27 620.712 725.41 630.613 700.114L630.636 700.06C641.169 674.116 646.484 644.657 646.484 611.612V102H669V611.612C669 657.123 660.319 696.203 642.735 728.666L642.726 728.684L642.716 728.701C625.161 760.463 600.727 784.835 569.466 801.717L569.45 801.725L569.436 801.733C538.847 817.954 503.812 826 464.452 826C425.09 826 389.754 817.954 358.552 801.752L358.519 801.734L358.486 801.717C327.239 784.843 302.504 760.491 284.318 728.763L284.29 728.715L284.265 728.666C266.681 696.203 258 657.123 258 611.612V307.676H403.345V611.612C403.345 660.307 413.67 700.851 434.046 733.493C454.078 764.962 483.971 780.729 524.439 780.729Z" fill="white"/>
          <path d="M403.662 174.63C403.662 214.762 371.035 247.26 330.831 247.26C290.627 247.26 258 214.762 258 174.63C258 134.498 290.627 102 330.831 102C371.035 102 403.662 134.498 403.662 174.63Z" fill="white"/>
        </svg>
      </span>
      <span class="brand">Ushi</span>
    </div>

    <h1>
      <span class="muted">Не теряй суть.</span>
      <span class="accent">Записывай важное</span>
    </h1>

    <p class="lead">Приложение, которое записывает звук и экран для важного, и превращает это в текст с удобным поиском.</p>

    <div class="action" id="action">
      <!-- populated by platform-detect script below -->
    </div>
  </main>
  <script>
    (function () {
      var ua = navigator.userAgent;
      var isMac = false, isWindows = false;

      if (navigator.userAgentData) {
        var p = (navigator.userAgentData.platform || '').toLowerCase();
        isMac = p === 'macos';
        isWindows = p === 'windows';
      }
      if (!isMac && !isWindows) {
        var plt = navigator.platform || '';
        isMac = /Mac/.test(plt) && !/iPhone|iPad/.test(ua);
        isWindows = /Win/.test(plt) || /Windows/.test(ua);
      }

      var action = document.getElementById('action');

      var appleIconSvg = '<svg class="apple-icon" viewBox="0 0 13.838 17" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M13.3977 5.7953C13.2991 5.8718 11.5583 6.8527 11.5583 9.0338C11.5583 11.5566 13.7734 12.4491 13.8397 12.4712C13.8295 12.5256 13.4878 13.6935 12.6718 14.8835C11.9442 15.9307 11.1843 16.9762 10.0283 16.9762C8.8723 16.9762 8.5748 16.3047 7.2403 16.3047C5.9398 16.3047 5.4774 16.9983 4.42 16.9983C3.3626 16.9983 2.6248 16.0293 1.7765 14.8393C0.7939 13.4419 0 11.271 0 9.2106C0 5.9058 2.1488 4.1531 4.2636 4.1531C5.3873 4.1531 6.324 4.8909 7.0295 4.8909C7.701 4.8909 8.7482 4.1089 10.0266 4.1089C10.5111 4.1089 12.2519 4.1531 13.3977 5.7953ZM9.4197 2.7098C9.9484 2.0825 10.3224 1.2121 10.3224 0.3417C10.3224 0.221 10.3122 0.0986 10.2901 0C9.4299 0.0323 8.4065 0.5729 7.7894 1.2886C7.3049 1.8394 6.8527 2.7098 6.8527 3.5921C6.8527 3.7247 6.8748 3.8573 6.885 3.8998C6.9394 3.91 7.0278 3.9219 7.1162 3.9219C7.888 3.9219 8.8587 3.4051 9.4197 2.7098Z" fill="white"/></svg>';

      var winIconSvg = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M0 1.916L5.733 1.1v5.55H0V1.916zm0 10.168L5.733 12.9V7.42H0v4.664zm6.267-11.03L14 0v6.65H6.267V1.054zm0 11.946V7.42H14V14l-7.733-1z" fill="currentColor"/></svg>';

      if (isWindows) {
        action.innerHTML =
          '<span class="cta-soon">' +
            winIconSvg +
            '<span>Скоро на Windows</span>' +
          '</span>' +
          '<p class="caption">Пока доступно только на Mac</p>';
      } else {
        action.innerHTML =
          '<a class="cta" href="https://github.com/zinchenko-stack/ushi/releases/latest/download/ushi.dmg">' +
            appleIconSvg +
            '<span>Скачать бесплатно</span>' +
          '</a>' +
          '<p class="caption">Apple Silicon · macOS 14.6+</p>';
      }
    })();
  </script>
</body>
</html>
